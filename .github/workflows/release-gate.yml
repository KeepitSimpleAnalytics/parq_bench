name: Release Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: windows-latest
    env:
      # No debug info on CI: much smaller target dir and faster linking.
      # DuckDB is compiled from C++ source, so its debug objects are large.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        shell: pwsh
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies (DuckDB's C++ build takes ~17 min cold).
      # Saved even when tests fail so a re-run doesn't rebuild DuckDB.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true

      - name: Install frontend deps
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix-report
          path: testdata/parquet/compat_matrix_report.json
