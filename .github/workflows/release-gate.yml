name: Release Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: windows-latest
    env:
      # No debug info on CI: much smaller target dir and faster linking.
      # DuckDB is compiled from C++ source, so its debug objects are large.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        shell: pwsh
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the version check reads the commits and main's version.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # Runs first so a missed bump fails in seconds, not after the build.
      # PRs: the PR's commits and title against main.
      # Pushes to main: the pushed commits against main as it was before the push.
      #   This catches a PR that was green against an older main (two PRs claiming the
      #   same new version) and squash merges whose title the PR check didn't see.
      - name: Check version
        shell: bash
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            EXTRA_SUBJECTS="$PR_TITLE" bash scripts/check-version-bump.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bash scripts/check-version-bump.sh "$BEFORE"
          else
            # Branch creation, or a force push whose old commit isn't fetched.
            echo "No earlier main commit to compare with; checking version files only."
            bash scripts/check-version-sync.sh
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies (DuckDB's C++ build takes ~17 min cold).
      # Saved even when tests fail so a re-run doesn't rebuild DuckDB.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true

      - name: Install frontend deps
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix-report
          path: testdata/parquet/compat_matrix_report.json

  # After the gate passes on main: publish the version unless it already has a release.
  # Creates the tag if needed. If the tag exists but its release doesn't (an earlier
  # release run failed), re-running this workflow releases it again.
  tag:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag a new version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./app/package.json').version")"
          if view=$(gh release view "$tag" 2>&1); then
            echo "$tag is already released; nothing to do."
            exit 0
          elif ! echo "$view" | grep -qi "release not found"; then
            echo "ERROR: couldn't check for an existing $tag release:"
            echo "$view"
            exit 1
          fi
          # Ask the remote, not this clone: a tag may have been pushed since checkout.
          if remote=$(git ls-remote --exit-code --tags origin "refs/tags/$tag"); then
            tagged_sha=${remote%%[[:space:]]*}
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              git fetch -q origin "refs/tags/$tag:refs/tags/$tag" || true
              if git merge-base --is-ancestor "$tagged_sha" "$GITHUB_SHA" 2>/dev/null; then
                # An earlier commit carries this version's tag: its release is still
                # running, or failed. This push (e.g. docs) doesn't change the version.
                echo "::notice::$tag is tagged on an earlier commit ($tagged_sha) with no release yet. It may still be building. If its release failed, run Actions > Release > Run workflow with $tag."
                exit 0
              fi
              echo "ERROR: $tag points at $tagged_sha, which is not part of main's history."
              echo "That tag was pushed from unmerged code. Bump the version on main, or remove that tag."
              exit 1
            fi
            echo "$tag exists on this commit but has no release; releasing it."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
