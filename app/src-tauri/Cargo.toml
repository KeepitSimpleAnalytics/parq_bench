[package]
name = "parq-bench"
version = "0.5.0"
description = "A high-performance desktop Parquet file viewer"
authors = ["KISA-Keep it Simple Analytics"]
edition = "2021"
default-run = "parq-bench"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "=1.20000.1", features = ["bundled", "parquet", "json"] }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
tokio = { version = "1.48.0", features = ["net"] }
tokio-tungstenite = "0.28.0"
futures-util = "0.3.31"
tauri-plugin-dialog = "2.6.0"
sysinfo = "0.38.1"
tauri-plugin-clipboard-manager = "2"

# DuckDB (incl. Parquet/JSON, now statically linked) is compiled from C++ source.
# Unoptimized, `tauri dev` previews run ~2x slower than on 1.4.4, where Parquet came
# from DuckDB's prebuilt release extension. Optimize it in dev builds; app code stays debug.
# debug = false keeps DuckDB's own DEBUG assertions off, matching release.
[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false
